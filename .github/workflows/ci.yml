name: ci
on:
  push:
    branches: 
      - "main"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  RUST_LOG: debug 
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  benchmark-report:
    name: Benchmark report data checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install plotly==6.5.0
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned rustfmt
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path benchmarks/turboselect/Cargo.toml -- --check

  build:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain and components
        run: |
          rustup update ${{ matrix.toolchain }}
          rustup default ${{ matrix.toolchain }}
          rustup component add clippy --toolchain ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: auguwu/clippy-action@1.4.0
        with:
            token: ${{secrets.GITHUB_TOKEN}}
      - run: cargo clippy --all-targets --all-features
      - run: cargo build --verbose --all-targets
      - run: cargo test --verbose --all-targets
      - run: cargo clippy --manifest-path benchmarks/turboselect/Cargo.toml --all-targets --all-features
      - run: cargo test --manifest-path benchmarks/turboselect/Cargo.toml --all-targets
