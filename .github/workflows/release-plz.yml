name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  release-pr:
    name: Prepare release PR
    if: github.repository == 'codyps/kth' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Prepare version and changelog
        id: release
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
          version: "0.4.2"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Dispatch explicitly because bot-created PRs do not run CI automatically.
      - name: Run CI on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -er '.head_branch' <<< "$RELEASE_PR")
          gh workflow run ci.yml --ref "$branch"
          gh workflow run nix.yml --ref "$branch"

  publish:
    name: Publish merged release
    if: github.repository == 'codyps/kth' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Test release contents
        run: |
          cargo test --all-targets
          cargo test --doc
      - name: Publish crate and GitHub release
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
          version: "0.4.2"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
