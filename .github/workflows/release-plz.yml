name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  release-pr:
    name: Prepare release PR
    if: github.repository == 'codyps/kth' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Create release PR token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          repositories: kth
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare version and changelog
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
          version: "0.4.2"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish merged release
    if: github.repository == 'codyps/kth' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Test release contents
        run: |
          cargo test --all-targets
          cargo test --doc
      - name: Publish crate and GitHub release
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
          version: "0.4.2"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
