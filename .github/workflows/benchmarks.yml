name: Benchmark report

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Sampling profile
        type: choice
        options: [ci, full, quick]
        default: ci

permissions:
  contents: read

# Serialize production runs so an older commit cannot replace a newer report.
# PR reports have their own group and cannot deploy to Pages.
concurrency:
  group: benchmark-report-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: Measure and graph
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      REPORT_PROFILE: ${{ github.event_name == 'pull_request' && 'quick' || inputs.profile || 'ci' }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install plotting dependency
        run: python -m pip install matplotlib==3.10.7
      - name: Check report data handling
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Run benchmarks and build report
        shell: bash
        run: |
          case "$REPORT_PROFILE" in
            quick) flags=(--quick) ;;
            ci) flags=(--ci) ;;
            full) flags=() ;;
            *) echo "Unknown sampling profile: $REPORT_PROFILE" >&2; exit 1 ;;
          esac
          python scripts/benchmark_report.py "${flags[@]}" --output target/benchmark-report
      - name: Keep report, measurements, and raw samples
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmark-report
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/benchmark-report

  deploy:
    name: Publish benchmark report
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: measure
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
