[package]
name = "kth-benchmarks"
version = "0.0.0"
edition = "2021"
publish = false
autobenches = false

[features]
instrumentation = ["kth/bench-instrumentation"]
experiments = []
# Optional C++ AVX-512 reference; requires KTH_X86_SIMD_SOURCE and g++.
native-simd = ["experiments"]

[dev-dependencies]
kth = { path = ".." }
criterion = "0.8"
rand = "0.9"
pdqselect = "0.1"
order-stat = "0.1"
adqselect = "0.1.5"
tpt-simd-sort = "0.1.1"
medians = "3.0.12"
# Upstream has no crates.io release. All comparisons run together in this crate.
turboselect = { git = "https://github.com/koskinev/turboselect", rev = "d8753c4ffe5b47f28670fea21d56cf3658d51b9b" }

[[bench]]
name = "comparisons"
harness = false

[profile.bench]
debug = 2

[profile.release]
debug = 2

[[bench]]
name = "selection"
harness = false

[[bench]]
name = "selection_counts"
harness = false
required-features = ["instrumentation"]

[[test]]
name = "selection_cases"
path = "tests/selection_cases.rs"

[[test]]
name = "experiments"
path = "tests/experiments.rs"
required-features = ["experiments"]

[[example]]
name = "profile_selection"
path = "examples/profile_selection.rs"
required-features = ["experiments"]

[[bench]]
name = "numeric_experiments"
harness = false
required-features = ["experiments"]
