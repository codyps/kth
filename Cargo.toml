[package]
name = "kth"
description = "Find the k-th order element of an array (one of which is the median)"
version = "0.1.1"
authors = ["Cody P Schafer <dev@codyps.com>"]
keywords = ["nth_element", "partition", "median", "quickselect", "no_std"]
repository = "https://github.com/codyps/kth"
documentation = "https://docs.rs/kth"
include = [ "Cargo.toml", "**/*.rs" ]
license = "Apache-2.0 OR MIT"
categories = [ "no-std", "algorithms" ]
edition = "2021"
autobenches = false

[dev-dependencies]
quickcheck = "1"
rand = "0.9"
pdqselect = "0.1"
order-stat = "0.1"
criterion = "0.8"
paste = "1.0.15"

[profile.bench]
debug = 2

[profile.release]
debug = 2

[[bench]]
name = "criterion"
harness = false
